databases:
  - name: arenacode-db
    databaseName: arenacode
    user: arenacode
    plan: free

services:
  - type: web
    name: arenacode
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: arenacode-db
          property: connectionString
